  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }

  .tone-gold .rail .fill { background: var(--ink); }
  .tone-gold .rail .rn .d { background: var(--gold); border-color: rgba(46,46,49,0.35); }
  .tone-gold .rail .rn .l { color: rgba(46,46,49,0.6); }
  .tone-gold .rail .rn.on .d { background: var(--ink); border-color: var(--ink); }
  .tone-gold .rail .rn.on .l { color: var(--ink); font-weight: 700; }
  .tone-gold .rail .rn.done .d { border-color: var(--ink); }

  .ghost { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 400px; line-height: 1; color: transparent; }

  .s1 .theme { left: 120px; top: 360px; width: 560px; color: var(--char); }
  .s1 .rule { left: 120px; top: 480px; }
  .s1 .ghost { left: 96px; top: 520px; -webkit-text-stroke: 3px rgba(240,176,40,0.35); }

  .s1 .root .ico { width: 46px; height: 46px; }
  .s1 svg.wires { left: 0; top: 0; }

  .s2 .hub svg { width: 86px; height: 86px; }
  .s2 .bub { width: 220px; height: 220px; border-radius: 50%; background: #fff; display: flex; flex-direction: column;

  .s2 .bub .n { font-family: "Oswald", sans-serif; font-size: 24px; color: var(--gold-deep); font-weight: 600; }
  .s2 .bub .s { font-size: 25px; font-weight: 700; line-height: 1.2; color: var(--ink); margin-top: 6px; }
  .s2 .bub.lm { background: var(--ink); }
  .s2 .bub.lm .s { color: #fff; font-size: 22px; }
  .s2 .bub .bf { width: 54px; height: 54px; }

  sup.tm { font-size: 0.42em; vertical-align: super; line-height: 0; margin-left: 2px; letter-spacing: 0; }
  .s2 .meta { left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
  .s2 .sky { inset: 0; background: linear-gradient(180deg, #1c1d29 0%, #3b2d3a 38%, #9a5a2c 68%, #e7a43a 88%, #f0b028 100%); }
  .s2 .sun { left: 1260px; top: 560px; width: 380px; height: 380px; border-radius: 50%;
    background: radial-gradient(circle, #fff3cf 0%, #f6c75a 35%, rgba(240,176,40,0) 70%); }
  .s2 .meta-logo { right: 110px; top: 48px; height: 64px; }
  .s2 .meta-text { left: 120px; top: 150px; width: 860px; }
  .s2 .meta-text .k { font-size: 30px; letter-spacing: 10px; color: var(--gold); font-weight: 600; }
  .s2 .meta-text .h { font-size: 118px; line-height: 1.0; color: #fff; font-weight: 700; margin-top: 8px; letter-spacing: 2px; }
  .s2 .meta-text .h sup.tm { color: var(--gold); }
  .s2 .meta-text .p { font-size: 66px; color: var(--gold); font-weight: 600; letter-spacing: 8px; margin-top: 6px; }
  .s2 .meta-text .d { font-size: 34px; line-height: 1.35; color: #fff; font-style: italic; margin-top: 22px; width: 780px;
    text-shadow: 0 2px 14px rgba(0,0,0,0.5); }
  .s2 .fly { left: 0; top: 0; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.35)); }
  /* 03 performance: staircase chart */
  .s3 .pillar { left: 120px; top: 190px; color: var(--gold); }
  .s3 .theme { left: 120px; top: 330px; width: 560px; color: #fff; }
  .s3 .rule { left: 120px; top: 450px; }
  .s3 .ghost { left: 96px; top: 520px; -webkit-text-stroke: 3px rgba(240,176,40,0.28); }
  .s3 svg.chart { left: 0; top: 0; }
  .s3 .bar { width: 236px; border-radius: 10px 10px 0 0; background: linear-gradient(180deg, #f6c75a 0%, #e6a420 100%);
    transform-origin: bottom center; overflow: hidden; }
  .s3 .bar .in { position: absolute; left: 0; right: 0; top: 0; padding: 20px 16px; }
  .s3 .bar .n { font-family: "Oswald", sans-serif; font-size: 26px; font-weight: 700; color: rgba(46,46,49,0.7); }
  .s3 .bar .s { font-size: 24px; font-weight: 800; line-height: 1.2; color: var(--ink); margin-top: 6px; }

  /* 04 capability: photo panel + tiles */
  .s4 .photo { left: 0; top: 141px; width: 900px; height: 939px; overflow: hidden; }
  .s4 .photo img { position: absolute; width: 2400px; height: 2400px; left: -1470px; top: -600px; transform-origin: 1920px 1070px; }
  .s4 .photo .shade { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(43,43,46,0.15) 0%, rgba(43,43,46,0.35) 40%, rgba(43,43,46,0.92) 82%); }
  .s4 .photo .edge { position: absolute; right: 0; top: 0; bottom: 0; width: 8px; background: var(--gold); }
  .s4 .pillar { left: 70px; top: 680px; color: var(--gold); }
  .s4 .theme { left: 70px; top: 820px; color: #fff; font-size: 34px; white-space: nowrap; }
  .s4 .tile { width: 400px; height: 320px; border-radius: 12px; background: #fff; box-shadow: 0 10px 30px rgba(46,46,49,0.08);

  .s4 .tile .ic { width: 96px; height: 96px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; }
  .s4 .tile .ic svg { width: 52px; height: 52px; }
  .s4 .tile .n { font-family: "Oswald", sans-serif; font-size: 34px; color: var(--gold-deep); font-weight: 600; }
  .s4 .tile .s { font-size: 30px; font-weight: 800; line-height: 1.2; color: var(--ink); }
  .s4 .qcard { left: 230px; top: 200px; width: 1460px; padding: 56px 70px 40px; background: #fff; border-radius: 14px;

  .s4 .qcard .qm { position: absolute; left: 40px; top: -40px; font-family: Georgia, serif; font-size: 170px; line-height: 1; color: var(--gold); font-weight: 700; }
  .s4 .qcard .q { font-size: 31px; line-height: 1.45; font-weight: 600; color: var(--ink); }

  .s5 .pillar { left: 0; right: 0; top: 168px; text-align: center; color: var(--gold); }
  .s5 .theme { left: 0; right: 0; top: 300px; text-align: center; color: #fff; font-size: 36px; }
  .s5 svg.radar { left: 0; top: 0; }
  .s5 .shield { left: 860px; top: 530px; width: 200px; height: 220px; }
  .s5 .stn { width: 500px; height: 120px; border-radius: 10px; background: var(--dark-2); display: flex; align-items: center; gap: 22px; padding: 0 30px; }
  .s5 .stn.l { border-left: 6px solid var(--gold); }
  .s5 .stn.r { border-right: 6px solid var(--gold); flex-direction: row-reverse; text-align: right; }
  .s5 .stn .n { font-family: "Oswald", sans-serif; font-size: 28px; color: var(--gold); font-weight: 600; }
  .s5 .stn .s { font-size: 29px; font-weight: 700; color: #fff; line-height: 1.2; }

  /* captions */
  #cap { position: absolute; left: 0; right: 0; bottom: 38px; display: flex; justify-content: center; z-index: 5; }
  #cap span { max-width: 1500px; padding: 12px 30px; border-radius: 8px; background: rgba(46,46,49,0.88);
    color: #fff; font-size: 32px; font-weight: 600; line-height: 1.3; text-align: center; }
  #cap.dark span { background: rgba(255,255,255,0.14); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); }
  #cap.ar span { font-family: "Cairo", "Open Sans", sans-serif; font-size: 36px; font-weight: 700; line-height: 1.45; padding: 8px 32px 12px; }

  /* closing */
  .layer > .cl-logo2 { left: 210px; top: 250px; transform: scale(0.75); }
  .cl-row { left: 0; right: 0; top: 120px; display: flex; justify-content: center; }
  .cl-w { font-size: 46px; font-weight: 600; color: var(--char); padding: 0 34px; position: relative; letter-spacing: 2px; }
  .cl-w + .cl-w::before { content: ""; position: absolute; left: -7px; top: 30px; width: 12px; height: 12px; border-radius: 50%; background: var(--gold); }
  .cl-logo { left: 0; right: 0; top: 500px; display: flex; justify-content: center; }
  .cl-logo img { height: 150px; }
  .cl-cta { left: 0; right: 0; top: 760px; display: flex; justify-content: center; align-items: center; gap: 44px; }
  .cl-cta .talk { font-family: "Oswald", sans-serif; text-transform: uppercase; font-size: 34px; letter-spacing: 4px; color: var(--ink); font-weight: 600;
    padding: 12px 28px; background: var(--gold); border-radius: 6px; }
  .cl-cta .ig { display: flex; align-items: center; gap: 12px; font-size: 32px; font-weight: 600; color: var(--char); }

  #wipe { position: absolute; top: 0; left: 0; width: 2472px; height: 1080px; z-index: 10; display: flex; }
  #wipe .p { flex: 1; background: var(--bg); }
  #wipe .e1 { width: 10px; background: var(--gold-soft); }
  #wipe .e2 { width: 26px; background: var(--gold); }
</style>
</head>

<div id="stage" class="grid-light">

    <path id="wave1" fill="none" stroke="#f0b028" stroke-width="3" opacity="0.5"/>
    <path id="wave2" fill="none" stroke="#58585c" stroke-width="1.5" opacity="0.14"/>
    <g id="sparks"></g>
  </svg>
  <div id="scenes"></div>
  <div id="cap"><span></span></div>
  <div id="wipe"><div class="e2"></div><div class="e1"></div><div class="p"></div><div class="e1"></div><div class="e2"></div></div>
</div>

<script src="timeline.js"></script>

let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function skyline(svg, { fill, maxH, minH, windows, cap }) {
  const g = svgEl('g', {}, svg);
  let x = -40;
  while (x < 2000) {
    const w = 60 + rnd() * 90;
    let h = minH + rnd() * (maxH - minH);
    if (cap) h = Math.min(h, cap(x));
    const top = 1080 - h;
    svgEl('rect', { x, y: top, width: w, height: h + 2, fill }, g);
    const r = rnd();
    if (r < 0.25) svgEl('rect', { x: x + w * 0.2, y: top - 30, width: w * 0.6, height: 32, fill }, g);       // stepped crown
    else if (r < 0.45) svgEl('rect', { x: x + w / 2 - 2, y: top - 70, width: 4, height: 72, fill }, g);     // spire
    else if (r < 0.6) svgEl('path', { d: `M${x} ${top} L${x + w / 2} ${top - 40} L${x + w} ${top}Z`, fill }, g);
    if (windows) {
      for (let wy = top + 16; wy < 1070; wy += 22)
        for (let wx = x + 10; wx < x + w - 12; wx += 16)
          if (rnd() < windows) svgEl('rect', { x: wx, y: wy, width: 7, height: 10, fill: rnd() < 0.8 ? '#f6c75a' : '#fff3cf', opacity: 0.35 + rnd() * 0.6 }, g);
    }
    x += w + 6 + rnd() * 18;
  }
  return g;
}

    if (u > 1) { x += 18 * Math.sin((t - mt) * 1.3); y += 14 * Math.sin((t - mt) * 1.9); }
    const [x2, y2] = path(Math.min(u, 1) + 0.01);
    const tilt = u < 1 ? Math.atan2(y2 - y, x2 - x) * 180 / Math.PI * 0.35 : 4 * Math.sin(t * 2);
    const flap = 0.2 + 0.8 * Math.abs(Math.cos((t - mt) * Math.PI * 4.2));
    fly.style.opacity = fade(t, mt, 0.3);
    fly.style.transform = `translate(${x - 100}px, ${y - 80}px) rotate(${tilt + 12}deg) scale(${0.9 + 0.25 * clamp(u)})`;
    wl.setAttribute('transform', `scale(${flap} 1)`);
    wr.setAttribute('transform', `scale(${flap} 1)`);
    dust.forEach((d, k) => {
      const back = (k + 1) * 0.022;
      const [dx, dy] = path(Math.min(u, 1) - back);
      const live = u - back > 0 ? 1 : 0;
      d.setAttribute('cx', dx + 6 * Math.sin(k * 2.1 + t * 3));
      d.setAttribute('cy', dy + 18 + 6 * Math.cos(k * 1.7 + t * 3));
      d.setAttribute('opacity', live * (1 - k / dust.length) * 0.8);
      d.setAttribute('r', 4.5 - k * 0.18);
    });
  };
}

// 03 performance: a staircase chart, one rising bar per service
function buildPerformance(th, idx) {
  const L = el('div', 'layer grid-dark s3', null, root);
  const ghost = el('div', 'abs ghost', '03', L);
  const hdr = header(L, idx, th.tone);
  const T = titleBlock(L, th);
  const chart = canvasSvg('chart', L);
  [380, 480, 580, 680, 780].forEach(y => svgEl('line', { x1: 740, x2: 1800, y1: y, y2: y, stroke: 'rgba(255,255,255,0.07)', 'stroke-width': 2 }, chart));
  const base = wire(chart, 'M740 880 H1800', 'rgba(255,255,255,0.35)', 3);
  const xs = [750, 1006, 1262, 1518], hs = [230, 330, 430, 530];
  const bars = th.services.map((s, k) => place(el('div', 'abs bar', `<div class="in"><div class="n">0${k + 1}</div><div class="s">${s}</div></div>`, L), xs[k], 880 - hs[k], 236, hs[k]));
  const pts = xs.map((x, k) => [x + 118, 880 - hs[k] - 46]);
  const END = [1930, 168];
  const trend = wire(chart, 'M' + pts.map(p => p.join(' ')).join(' L') + ` L${END[0]} ${END[1]}`, '#f0b028', 5);
  const dots = pts.map(([x, y]) => svgEl('circle', { cx: x, cy: y, r: 10, fill: '#2b2b2e', stroke: '#f0b028', 'stroke-width': 5 }, chart));
  // how far along the trend line each point sits, so it draws in step with the bars
  const seg = [0];
  for (let k = 1; k < pts.length; k++) seg.push(seg[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]));
  const total = seg[3] + Math.hypot(END[0] - pts[3][0], END[1] - pts[3][1]);
  return (t, s, e, marks) => {
    hdr(t, s, e);
    animateTitle(T, t, s);
    ghost.style.opacity = fade(t, s + 0.6, 1.2);
    const at = th.services.map((_, k) => marks[k] ?? s + 1.7 + k * 0.6);
    draw(base, prog(t, s + 0.9, 0.9, easeInOut));
    let line = 0;
    bars.forEach((b, k) => {
      const p = prog(t, at[k] - 0.15, 0.7);
      const hl = spoken(t, at, k);
      b.style.transform = `scaleY(${p})`;
      b.style.opacity = p > 0 ? 1 : 0;
      b.style.boxShadow = `0 0 ${40 * hl}px rgba(240,176,40,${0.55 * hl})`;
      b.style.filter = `brightness(${1 + 0.12 * hl})`;
      b.querySelector('.in').style.opacity = fade(t, at[k] + 0.35, 0.3);
      dots[k].setAttribute('opacity', fade(t, at[k] + 0.4, 0.2));
      if (t >= at[k] + 0.3) line = Math.max(line, seg[k] / total);
      if (k > 0 && t >= at[k] - 0.2) line = Math.max(line, lerp(seg[k - 1], seg[k], prog(t, at[k] - 0.2, 0.6)) / total);
    });
    if (t >= at[3] + 0.3) line = Math.max(line, lerp(seg[3], total, prog(t, at[3] + 0.6, 1.0)) / total);
    draw(trend, line);
  };
}

// 04 capability: photo panel, service tiles, then the Aramex testimonial
function buildCapability(th, idx) {
  const L = el('div', 'layer grid-light s4', null, root);
  const hdr = header(L, idx, th.tone);
  const photo = el('div', 'abs photo', null, L);
  const pimg = img('assets/key-visual.jpg', null, photo);
  el('div', 'shade', null, photo);
  const edge = el('div', 'edge', null, photo);
  const T = titleBlock(L, th, false);
  const tx = [960, 1400], ty = [200, 560];
  const tiles = th.services.map((s, k) => place(el('div', 'abs tile',
    `<div class="top"><div class="ic">${icon(ICON_BODY[th.icons[k]], '#ffffff', 3.4)}</div><div class="n">0${k + 1}</div></div><div class="s">${s}</div>`, L), tx[k % 2], ty[k >> 1]));
  const q = th.quote;
  const card = el('div', 'abs qcard', `<div class="qm">\u201C</div><div class="q">${q.q}</div>
    <div class="foot"><div><div class="who">${q.who}</div><div class="org">${q.org}</div></div><img src="${q.logo}"></div>`, L);
  images.push(card.querySelector('img'));
  return (t, s, e, marks) => {
    hdr(t, s, e);
    const pp = prog(t, s, 0.9, easeInOut);
    photo.style.clipPath = `inset(0 ${(1 - pp) * 100}% 0 0)`;
    pimg.style.transform = `scale(${1.08 - 0.06 * clamp((t - s) / (e - s))})`;
    animateTitle(T, t, s + 0.3, -40);
    const at = th.services.map((_, k) => marks[k] ?? s + 1.7 + k * 0.6);
    tiles.forEach((tile, k) => {
      const p = prog(t, at[k] - 0.1, 0.6, easeBack);
      const hl = spoken(t, at, k);
      tile.style.opacity = fade(t, at[k] - 0.1, 0.25);
      tile.style.transform = `translateY(${(1 - p) * 40 - 10 * hl}px) scale(${0.9 + 0.1 * p})`;
      tile.style.background = mixRGB([255, 255, 255], [240, 176, 40], hl);
      tile.querySelector('.ic').style.background = mixRGB([240, 176, 40], [46, 46, 49], hl);
      tile.querySelector('.n').style.color = mixRGB([217, 154, 20], [46, 46, 49], hl);
    });
    // the tiles and heading clear, the photo opens to full width, the testimonial rises
    const qt = marks.q ?? s + 9;
    const out = prog(t, qt - 0.7, 0.7, easeInOut);
    tiles.forEach((tile, k) => { if (out > 0) { tile.style.opacity = 1 - out; tile.style.transform += ` translateX(${out * 120}px)`; } });
    [T.pillar, T.theme].forEach(n => { if (out > 0) n.style.opacity = Math.min(parseFloat(n.style.opacity || 1), 1 - out); });
    const wide = prog(t, qt - 0.5, 1.0, easeInOut);
    photo.style.width = lerp(900, 1920, wide) + 'px';
    pimg.style.left = lerp(-1470, -240, wide) + 'px';
    edge.style.opacity = 1 - wide;
    const cp = prog(t, qt + 0.2, 0.9);
    card.style.opacity = fade(t, qt + 0.2, 0.3);
    card.style.transform = `translateY(${(1 - cp) * 60}px)`;
  };
}

// 05 resilience: a shield with pulse rings, the services as stations around it
function buildResilience(th, idx) {
  const L = el('div', 'layer grid-dark s5', null, root);
  const hdr = header(L, idx, th.tone);
  const T = titleBlock(L, th, false);
  const radar = canvasSvg('radar', L);
  const C = [960, 640];
  const rings = [0, 1, 2].map(() => svgEl('circle', { cx: C[0], cy: C[1], r: 120, fill: 'none', stroke: '#f0b028', 'stroke-width': 3 }, radar));
  const halo = svgEl('circle', { cx: C[0], cy: C[1], r: 130, fill: 'rgba(240,176,40,0.08)', stroke: 'rgba(240,176,40,0.35)', 'stroke-width': 2 }, radar);
  const spots = [[150, 430, 'l'], [150, 700, 'l'], [1270, 430, 'r'], [1270, 700, 'r']];
  const links = spots.map(([x, y, side]) => {
    const cy = y + 60, ex = side === 'l' ? x + 500 : x;
    const sx = side === 'l' ? C[0] - 110 : C[0] + 110;
    return wire(radar, `M${sx} ${C[1] + (cy < C[1] ? -40 : 40)} L${ex} ${cy}`, 'rgba(240,176,40,0.7)', 3);
  });
  const shield = el('div', 'abs shield', `<svg viewBox="0 0 200 220"><path d="M100 8l84 30v62c0 54-36 90-84 112C52 190 16 154 16 100V38z" fill="#f0b028"/>
    <path class="tick" d="M62 112l28 28 52-56" fill="none" stroke="#2b2b2e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>`, L);
  const tick = shield.querySelector('.tick');
  const stns = th.services.map((s, k) => place(el('div', 'abs stn ' + spots[k][2], `<div class="n">0${k + 1}</div><div class="s">${s}</div>`, L), spots[k][0], spots[k][1]));
  return (t, s, e, marks) => {
    hdr(t, s, e);
    const pp = prog(t, s + 0.4, 1.0);
    T.pillar.style.opacity = pp;
    T.pillar.style.transform = `scale(${0.9 + 0.1 * pp})`;
    rise(T.theme, prog(t, s + 0.8, 0.9));
    const at = th.services.map((_, k) => marks[k] ?? s + 1.7 + k * 0.6);
    const vo = VO_THEMES[idx] || { segments: [] };
    const ready = vo.segments[5] ? vo.segments[5].t : at[3] + 2;
    pop(shield, prog(t, s + 0.9, 0.8, easeBack), 0.4);
    halo.setAttribute('opacity', fade(t, s + 1.1, 0.5));
    const pulse = fade(t, s + 1.4, 0.6);
    rings.forEach((r, j) => {
      const ph = ((t - s) / 2.4 + j / 3) % 1;
      r.setAttribute('r', 120 + 170 * ph);
      r.setAttribute('opacity', (1 - ph) * 0.55 * pulse);
    });
    stns.forEach((st, k) => {
      draw(links[k], prog(t, at[k] - 0.4, 0.4));
      const p = prog(t, at[k] - 0.1, 0.6, easeBack);
      const hl = Math.max(spoken(t, at, k, ready - at[k]), prog(t, ready - 0.1, 0.4));
      const dir = spots[k][2] === 'l' ? -1 : 1;
      st.style.opacity = fade(t, at[k] - 0.1, 0.25);
      st.style.transform = `translateX(${(1 - p) * 60 * dir}px)`;
      st.style.background = mixRGB([56, 56, 60], [74, 66, 44], hl);
      st.style.boxShadow = `0 0 ${30 * hl}px rgba(240,176,40,${0.35 * hl})`;
    });
    // "so a crisis meets a prepared team": the shield locks in
    tick.setAttribute('stroke-dashoffset', 1 - prog(t, ready, 0.6, easeInOut));
    const lock = prog(t, ready, 0.5, easeBack) * (1 - prog(t, ready + 0.5, 0.6));
    shield.style.transform = `scale(${1 + 0.08 * lock})`;
  };
}

const builders = [buildStructure, buildPeople, buildPerformance, buildCapability, buildResilience];
const themeScenes = THEMES.map((th, i) => {
  const update = builders[i](th, i);
  const L = root.lastElementChild;
  return { L, update, th };
});

const close = el('div', 'layer', null, root);
const clRow = el('div', 'abs cl-row', null, close);
const clWords = THEMES.map(th => el('div', 'cl-w head', th.pillar, clRow));
const clLogo = el('div', 'abs logo2 cl-logo2', null, close);
const clMark = img('assets/logo2-mark.png', 'abs l-mark', clLogo);
const clWord = img('assets/logo2-word.png', 'abs l-word', clLogo);
const clSlogan = img('assets/logo2-tag.png', 'abs l-tag', clLogo);
const clCta = el('div', 'abs cl-cta', `<div class="talk">Talk to our team</div><div class="ig">${WEB_ICON}<span>${WEBSITE}</span></div><div class="ig">${IG_ICON}<span>${INSTAGRAM}</span></div>`, close);

const cap = document.querySelector('#cap span');
const capBox = document.getElementById('cap');
if (LANG === 'ar') { capBox.classList.add('ar'); cap.dir = 'rtl'; cap.lang = 'ar'; }
const wipe = document.getElementById('wipe');
const wipePanel = wipe.querySelector('.p');

// background waves for the opening, overview and closing
const glow = document.getElementById('glow');
const wave1 = document.getElementById('wave1');
const wave2 = document.getElementById('wave2');
const sparks = document.getElementById('sparks');
const sparkNodes = Array.from({ length: 9 }, () => svgEl('circle', { r: 5, fill: '#f0b028' }, sparks));
function waveY(x, t, amp, base, k, speed) {
  return base + amp * Math.sin(x * k + t * speed) + amp * 0.4 * Math.sin(x * k * 2.3 - t * speed * 0.7);
}
function wavePath(t, amp, base, k, speed) {
  let d = '';
  for (let x = -20; x <= 1940; x += 20) d += (x === -20 ? 'M' : 'L') + x + ' ' + waveY(x, t, amp, base, k, speed).toFixed(1) + ' ';
  return d;
}

// ---------- render ----------
window.seek = function (t) {
  // wipe: a panel in the incoming scene's colour, with gold edges, sweeps across;
  // scenes cut underneath it, so two scenes are never on screen together
  const tr = TRANSITIONS.find(([x]) => Math.abs(t - x) < WIPE / 2);
  if (tr) {
    const p = easeInOut(clamp((t - tr[0] + WIPE / 2) / WIPE));
    wipe.style.visibility = 'visible';
    wipe.style.transform = `translateX(${-2472 + p * 4392}px)`;
    wipePanel.style.background = TONE_BG[tr[1]];
  } else wipe.style.visibility = 'hidden';

  const inThemes = t >= TL.themes[0][0] && t < TL.close[0];
  glow.style.visibility = inThemes || t < TL.reveal[0] ? 'hidden' : 'visible';
  if (!inThemes) {
    wave1.setAttribute('d', wavePath(t, 40, 945, 0.0042, 0.5));
    wave2.setAttribute('d', wavePath(t, 26, 990, 0.006, -0.35));
    sparkNodes.forEach((c, i) => {
      const x = ((i * 233 + t * 70) % 2100) - 90;
      c.setAttribute('cx', x);
      c.setAttribute('cy', waveY(x, t, 40, 945, 0.0042, 0.5));
      c.setAttribute('opacity', 0.55 + 0.35 * Math.sin(t * 2 + i));
    });
  }

  show(reveal, within(t, TL.reveal));
  if (within(t, TL.reveal)) {
    const s = TL.reveal[0];
    const mp = prog(t, s + 0.3, 1.0, easeBack);
    lgMark.style.opacity = fade(t, s + 0.3, 0.4);
    lgMark.style.transformOrigin = '300px 301px';
    lgMark.style.transform = `scale(${0.3 + 0.7 * mp}) rotate(${(1 - mp) * -120}deg)`;
    lgWord.style.clipPath = `inset(0 ${(1 - prog(t, s + 1.1, 1.0, easeInOut)) * 100}% 0 0)`;
    const st = (VO_BY_ID.slogan || { start: s + 2.6 }).start;
    lgTag.style.clipPath = `inset(0 ${(1 - prog(t, st - 0.1, 1.7, x => x)) * 100}% 0 0)`;
  }

  show(titleL, within(t, TL.title));
  if (within(t, TL.title)) {
    const s = TL.title[0];
    const t0 = (VO_BY_ID.title || { start: s + 0.6 }).start;
    pop(tMark, prog(t, s + 0.2, 0.8, easeBack), 0.4);
    tGlow.style.opacity = fade(t, s + 0.2, 1.0) * (0.8 + 0.2 * Math.sin(t * 1.5));
    tWords.forEach((w, k) => {
      const p = prog(t, t0 - 0.15 + k * 0.38, 0.7);
      w.style.transform = `translateY(${(1 - p) * 105}%)`;
    });
    // a light sweep across "Progress" once the title has landed
    const sw = prog(t, t0 + 1.8, 1.4, easeInOut);
    tProg.style.backgroundPosition = `${100 - sw * 100}% 0`;
    const z = prog(t, s, TL.title[1] - s, x => x);
    tLine1.style.transform = tLine2.style.transform = `scale(${1 + 0.03 * z})`;
  }

  show(over, within(t, TL.overview));
  if (within(t, TL.overview)) {
    const s = TL.overview[0];
    rise(ovTitle, prog(t, s + 0.5, 1));
    ovLine.style.transform = `scaleX(${prog(t, s + 1.0, 2.0, easeInOut)})`;
    ovNodes.forEach((n, i) => {
      const at = VO_OVER.marks[i] ?? s + 1.3 + i * 0.55;
      const p = prog(t, at - 0.1, 0.8, easeBack);
      n.style.opacity = clamp((t - at + 0.1) / 0.3);
      n.style.transform = `translateY(${(1 - p) * 30}px) scale(${0.85 + 0.15 * p})`;
    });
  }

  let tone = within(t, TL.title) ? 'dark' : 'light';
  themeScenes.forEach((S, i) => {
    const span = TL.themes[i];
    const on = within(t, span);
    show(S.L, on);
    if (!on) return;
    tone = S.th.tone;
    S.update(t, span[0], span[1], (VO_THEMES[i] || {}).marks || {});
  });

  show(close, t >= TL.close[0]);
  if (t >= TL.close[0]) {
    const s = TL.close[0];
    clWords.forEach((w, i) => rise(w, prog(t, s + 0.5 + i * 0.25, 0.8), 30));
    const mp = prog(t, s + 1.0, 0.9, easeBack);
    clMark.style.opacity = fade(t, s + 1.0, 0.3);
    clMark.style.transformOrigin = '300px 301px';
    clMark.style.transform = `scale(${0.4 + 0.6 * mp}) rotate(${(1 - mp) * -90}deg)`;
    clWord.style.clipPath = `inset(0 ${(1 - prog(t, s + 1.5, 0.9, easeInOut)) * 100}% 0 0)`;
    const st = (VO_BY_ID['close-slogan'] || { start: s + 2.3 }).start;
    clSlogan.style.clipPath = `inset(0 ${(1 - prog(t, st - 0.1, 1.7, x => x)) * 100}% 0 0)`;
    rise(clCta, prog(t, s + 6.2, 0.9), 30);
  }

  const cue = CUES.find(c => t >= c.t && t < c.end);
  capBox.classList.toggle('dark', tone === 'dark');
  if (cue) {
    cap.textContent = cue.text;
    capBox.style.opacity = Math.min(clamp((t - cue.t) / 0.15), clamp((cue.end - t) / 0.15));
    capBox.style.visibility = 'visible';
  } else capBox.style.visibility = 'hidden';
};

// fit each pillar heading to the space its layout gives it
const PILLAR_FIT = [[600, 150], [720, 150], [600, 150], [760, 130], [1100, 130]];
function fitPillars() {
  themeScenes.forEach((S, i) => {
    const p = S.L.querySelector('.pillar');
    let [maxW, size] = PILLAR_FIT[i];
    p.style.fontSize = size + 'px';
    const measure = () => { const r = document.createRange(); r.selectNodeContents(p); return r.getBoundingClientRect().width; };
    const vis = S.L.style.visibility;
    S.L.style.visibility = 'visible';
    while (measure() > maxW && size > 70) p.style.fontSize = (--size) + 'px';
    S.L.style.visibility = vis;
  });
}

window.ready = Promise.all([
  document.fonts.load('600 40px Oswald'),
  document.fonts.load('700 40px "Open Sans"'),
  document.fonts.load('700 36px Cairo', 'عربي'),
  ...images.map(n => n.complete ? Promise.resolve() : new Promise(r => { n.onload = r; n.onerror = r; }))
]).then(() => document.fonts.ready).then(fitPillars);
window.seek(0);
</script>
