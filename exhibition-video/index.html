<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mira-Clé Exhibition Video</title>
<style>

  @font-face { font-family: "Open Sans"; src: url("assets/fonts/OpenSans.woff2") format("woff2"); font-weight: 300 800; }
  @font-face { font-family: "Cairo"; src: url("assets/fonts/Cairo-Arabic.woff2") format("woff2"); font-weight: 200 1000; }
  /* brand colours sampled from the Mira-Clé logo */
  :root {
    --bg: #fbfaf7;
    --panel: #f1f0ed;
    --line: #e2e0db;
    --gold: #f0b028;
    --gold-soft: #f6cf78;
    --gold-deep: #d99a14;
    --char: #58585c;
    --ink: #2e2e31;
    --dark: #2b2b2e;

    --muted: #8b8b90;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: "Open Sans", sans-serif; color: var(--ink); }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }

  .abs { position: absolute; }
  .head { font-family: "Oswald", sans-serif; text-transform: uppercase; }
  .grid-light {
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(88,88,92,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(88,88,92,0.05) 1px, transparent 1px);
    background-size: 80px 80px;
  }
  .grid-dark {
    background-color: var(--dark);
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 80px 80px;
  }
  .grid-gold {
    background-color: var(--gold);
    background-image: radial-gradient(rgba(255,255,255,0.22) 2px, transparent 2.5px);
    background-size: 40px 40px;
  }
  #glow { position: absolute; inset: 0; }

  /* opening: the logo file is 2000x602; its three parts sit at their original offsets */
  .logo2 { width: 2000px; height: 602px; transform-origin: 0 0; }
  .logo2 .l-mark { left: 0; top: 0; width: 620px; height: 602px; }

  .logo2 .l-tag { left: 620px; top: 460px; width: 1380px; height: 120px; }

  .open-title { top: 620px; font-size: 100px; color: var(--ink); letter-spacing: 3px; }

  /* title words that rise into place */
  .t-line { left: 0; right: 0; text-align: center; font-weight: 700; line-height: 1.05; white-space: nowrap; }
  .t-line span { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 4px; }
  .t-line i { display: inline-block; font-style: normal; }
  .t-line .prog { color: var(--gold);
    background: linear-gradient(100deg, #f0b028 0%, #f0b028 40%, #fff3cf 50%, #f0b028 60%, #f0b028 100%);

  /* overview */

  .ov-node .t { font-size: 23px; color: var(--muted); margin-top: 8px; line-height: 1.35; padding: 0 10px; }

  /* header for the practice scenes, in three tones */
  .num { left: 120px; top: 62px; font-family: "Oswald", sans-serif; font-size: 30px; letter-spacing: 4px; color: var(--muted); }
  .num b { color: var(--gold); font-weight: 600; }
  .hdr-logo { right: 110px; top: 48px; height: 64px; }
  .rail { left: 520px; width: 880px; top: 58px; height: 60px; }
  .rail .track { position: absolute; left: 0; right: 0; top: 11px; height: 2px; background: var(--line); }
  .rail .fill { position: absolute; left: 0; top: 11px; height: 2px; background: var(--gold); }
  .rail .rn { position: absolute; top: 0; width: 200px; margin-left: -100px; text-align: center; }
  .rail .rn .d { width: 24px; height: 24px; border-radius: 50%; margin: 0 auto; background: var(--bg); border: 2px solid var(--line); }
  .rail .rn .l { font-family: "Oswald", sans-serif; font-size: 18px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-top: 6px; }

  .tone-dark .num { color: rgba(255,255,255,0.55); }

  .tone-dark .rail .rn .d { background: var(--dark); border-color: rgba(255,255,255,0.25); }
  .tone-dark .rail .rn .l { color: rgba(255,255,255,0.5); }
  .tone-dark .rail .rn.on .d { background: var(--gold); border-color: var(--gold); }
  .tone-dark .rail .rn.on .l { color: var(--gold); }
  .tone-dark .rail .rn.done .d { border-color: var(--gold); }

  .tone-gold .num, .tone-gold .num b { color: var(--ink); }

  .tone-gold .rail .fill { background: var(--ink); }
  .tone-gold .rail .rn .d { background: var(--gold); border-color: rgba(46,46,49,0.35); }
  .tone-gold .rail .rn .l { color: rgba(46,46,49,0.6); }
  .tone-gold .rail .rn.on .d { background: var(--ink); border-color: var(--ink); }
  .tone-gold .rail .rn.on .l { color: var(--ink); font-weight: 700; }
  .tone-gold .rail .rn.done .d { border-color: var(--ink); }
  .tone-gold .hdr-rule { background: rgba(46,46,49,0.18); }

  /* shared scene typography */
  .pillar { font-weight: 700; line-height: 1; letter-spacing: 2px; white-space: nowrap; }
  .theme { font-size: 38px; font-weight: 700; line-height: 1.2; }
  .rule { height: 5px; width: 140px; background: var(--gold); transform-origin: left center; }
  .ghost { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 400px; line-height: 1; color: transparent; }
  .ico svg { width: 100%; height: 100%; }

  /* 01 structure: org chart */
  .s1 .pillar { left: 120px; top: 190px; color: var(--gold); }
  .s1 .theme { left: 120px; top: 360px; width: 560px; color: var(--char); }
  .s1 .rule { left: 120px; top: 480px; }
  .s1 .ghost { left: 96px; top: 520px; -webkit-text-stroke: 3px rgba(240,176,40,0.35); }
  .s1 .root { left: 1020px; top: 200px; width: 520px; height: 104px; background: var(--ink); color: #fff; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 32px; letter-spacing: 2px; font-weight: 600; }
  .s1 .root .ico { width: 46px; height: 46px; }
  .s1 svg.wires { left: 0; top: 0; }
  .s1 .node { top: 440px; width: 230px; height: 300px; background: #fff; border-radius: 10px; border-top: 6px solid var(--gold);
    box-shadow: 0 8px 24px rgba(46,46,49,0.08); padding: 22px 16px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .s1 .node .n { font-family: "Oswald", sans-serif; font-size: 24px; color: var(--gold-deep); font-weight: 600; }
  .s1 .node .ico { width: 76px; height: 76px; margin: 18px 0 20px; }
  .s1 .node .s { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; line-height: 1.2; color: var(--ink); }
  .s1 .twig { width: 24px; height: 24px; border-radius: 50%; background: var(--bg); border: 3px solid var(--gold); }

  /* 02 people: team network + testimonial */
  .s2 .pillar { left: 120px; top: 165px; color: var(--ink); }
  .s2 .theme { left: 120px; top: 330px; color: rgba(46,46,49,0.8); white-space: nowrap; font-size: 36px; }
  .s2 .ghost { left: 1460px; top: 560px; -webkit-text-stroke: 3px rgba(255,255,255,0.5); }
  .s2 .net { left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 960px 655px; }
  .s2 .hub { width: 170px; height: 170px; border-radius: 50%; background: var(--ink);
    display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 14px rgba(46,46,49,0.12); }
  .s2 .hub svg { width: 86px; height: 86px; }
  .s2 .bub { width: 220px; height: 220px; border-radius: 50%; background: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 26px; box-shadow: 0 12px 30px rgba(46,46,49,0.15); }
  .s2 .bub .n { font-family: "Oswald", sans-serif; font-size: 24px; color: var(--gold-deep); font-weight: 600; }
  .s2 .bub .s { font-size: 25px; font-weight: 700; line-height: 1.2; color: var(--ink); margin-top: 6px; }
  .s2 .bub.lm { background: var(--ink); }
  .s2 .bub.lm .s { color: #fff; font-size: 22px; }
  .s2 .bub .bf { width: 54px; height: 54px; }
  .s2 .bub .bf svg { width: 100%; height: 100%; }
  sup.tm { font-size: 0.42em; vertical-align: super; line-height: 0; margin-left: 2px; letter-spacing: 0; }
  .s2 .meta { left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
  .s2 .scenery { left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 1300px 700px; }
  .s2 .sky { inset: 0; background: linear-gradient(180deg, #15161f 0%, #2b2333 30%, #5d3a3a 52%, #b5682a 72%, #e7a43a 86%, #f0b028 100%); }
  .s2 .sun { left: 1180px; top: 690px; width: 460px; height: 460px; border-radius: 50%;
    background: radial-gradient(circle, #fff3cf 0%, #f6c75a 26%, rgba(240,176,40,0.35) 46%, rgba(240,176,40,0) 70%); }
  .s2 .meta-logo { right: 110px; top: 48px; height: 64px; }
  .s2 .meta-text { left: 120px; top: 150px; width: 860px; }
  .s2 .meta-text .k { font-size: 30px; letter-spacing: 10px; color: var(--gold); font-weight: 600; }
  .s2 .meta-text .h { font-size: 118px; line-height: 1.0; color: #fff; font-weight: 700; margin-top: 8px; letter-spacing: 2px;
    text-shadow: 0 4px 24px rgba(0,0,0,0.35); }
  .s2 .meta-text .h sup.tm { color: var(--gold); }
  .s2 .meta-text .p { font-size: 66px; color: var(--gold); font-weight: 600; letter-spacing: 8px; margin-top: 6px; }
  .s2 .meta-text .d { font-size: 34px; line-height: 1.35; color: #fff; font-style: italic; margin-top: 22px; width: 780px;
    text-shadow: 0 2px 14px rgba(0,0,0,0.6); }
  .s2 .fly { left: 0; top: 0; filter: drop-shadow(0 10px 18px rgba(0,0,0,0.4)) drop-shadow(0 0 22px rgba(246,199,90,0.35)); }
  /* 03 performance: staircase chart */
  .s3 .pillar { left: 120px; top: 190px; color: var(--gold); }
  .s3 .theme { left: 120px; top: 330px; width: 560px; color: #fff; }
  .s3 .rule { left: 120px; top: 450px; }
  .s3 .ghost { left: 96px; top: 520px; -webkit-text-stroke: 3px rgba(240,176,40,0.28); }
  .s3 svg.chart { left: 0; top: 0; }
  .s3 .bar { width: 236px; border-radius: 10px 10px 0 0; background: linear-gradient(180deg, #f6c75a 0%, #e6a420 100%);
    transform-origin: bottom center; overflow: hidden; }
  .s3 .bar .in { position: absolute; inset: 0; padding: 16px 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .s3 .bar .n { font-family: "Oswald", sans-serif; font-size: 26px; font-weight: 700; color: rgba(46,46,49,0.7); }
  .s3 .bar .s { font-size: 24px; font-weight: 800; line-height: 1.2; color: var(--ink); margin-top: 6px; }

  /* 04 capability: photo panel + tiles */
  .s4 .photo { left: 0; top: 141px; width: 900px; height: 939px; overflow: hidden; }
  .s4 .photo img { position: absolute; width: 2400px; height: 2400px; left: -1470px; top: -600px; transform-origin: 1920px 1070px; }
  .s4 .photo .shade { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(43,43,46,0.15) 0%, rgba(43,43,46,0.35) 40%, rgba(43,43,46,0.92) 82%); }
  .s4 .photo .edge { position: absolute; right: 0; top: 0; bottom: 0; width: 8px; background: var(--gold); }
  .s4 .pillar { left: 70px; top: 680px; color: var(--gold); }
  .s4 .theme { left: 70px; top: 820px; color: #fff; font-size: 34px; white-space: nowrap; }
  .s4 .tile { width: 400px; height: 320px; border-radius: 12px; background: #fff; box-shadow: 0 10px 30px rgba(46,46,49,0.08);
    padding: 34px 36px; display: flex; flex-direction: column; justify-content: space-between; }
  .s4 .tile .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .s4 .tile .ic { width: 96px; height: 96px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; }
  .s4 .tile .ic svg { width: 52px; height: 52px; }
  .s4 .tile .n { font-family: "Oswald", sans-serif; font-size: 34px; color: var(--gold-deep); font-weight: 600; }
  .s4 .tile .s { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding-top: 10px; font-size: 30px; font-weight: 800; line-height: 1.2; color: var(--ink); }
  .s4 .qcard { left: 230px; top: 200px; width: 1460px; padding: 56px 70px 40px; background: #fff; border-radius: 14px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.35); border-top: 8px solid var(--gold); }
  .s4 .qcard .qm { position: absolute; left: 40px; top: -40px; font-family: Georgia, serif; font-size: 170px; line-height: 1; color: var(--gold); font-weight: 700; }
  .s4 .qcard .q { font-size: 31px; line-height: 1.45; font-weight: 600; color: var(--ink); }
  .s4 .qcard .who { font-size: 24px; font-weight: 700; font-style: italic; }
  .s4 .qcard .org { margin-top: 2px; font-size: 21px; color: var(--char); }
  .s4 .qcard .foot { margin-top: 28px; padding-top: 22px; border-top: 2px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .s4 .qcard img { height: 74px; }

  /* 05 resilience: shield and stations */
  .s5 .pillar { left: 0; right: 0; top: 168px; text-align: center; color: var(--gold); }
  .s5 .theme { left: 0; right: 0; top: 300px; text-align: center; color: #fff; font-size: 36px; }
  .s5 svg.radar { left: 0; top: 0; }
  .s5 .shield { left: 860px; top: 530px; width: 200px; height: 220px; }
  .s5 .stn { width: 500px; height: 120px; border-radius: 10px; background: var(--dark-2); display: flex; align-items: center; justify-content: center; gap: 20px; padding: 0 30px; text-align: center; }
  .s5 .stn.l { border-left: 6px solid var(--gold); }
  .s5 .stn.r { border-right: 6px solid var(--gold); flex-direction: row-reverse; }
  .s5 .stn .n { font-family: "Oswald", sans-serif; font-size: 28px; color: var(--gold); font-weight: 600; }
  .s5 .stn .s { font-size: 29px; font-weight: 700; color: #fff; line-height: 1.2; }

  /* captions */
  #cap { position: absolute; left: 0; right: 0; bottom: 38px; display: flex; justify-content: center; z-index: 5; }
  #cap span { max-width: 1500px; padding: 12px 30px; border-radius: 8px; background: rgba(46,46,49,0.88);
    color: #fff; font-size: 32px; font-weight: 600; line-height: 1.3; text-align: center; }
  #cap.dark span { background: rgba(255,255,255,0.14); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); }
  #cap.ar span { font-family: "Cairo", "Open Sans", sans-serif; font-size: 36px; font-weight: 700; line-height: 1.45; padding: 8px 32px 12px; }

  /* closing end card */
  .end-card { background: var(--bg); }
  .end-glow { left: 360px; top: 120px; width: 1200px; height: 700px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(240,176,40,0.16), rgba(240,176,40,0)); }
  .cl-row { left: 0; right: 0; top: 150px; display: flex; justify-content: center; }
  .cl-w { font-size: 26px; font-weight: 500; color: var(--muted); padding: 0 26px; position: relative; letter-spacing: 6px; }
  .cl-w + .cl-w::before { content: ""; position: absolute; left: -4px; top: 17px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
  .layer > .cl-logo2 { left: 480px; top: 330px; transform-origin: 0 0; transform: scale(0.48); }
  .cl-rule { left: 900px; width: 120px; top: 708px; height: 3px; background: var(--gold); transform-origin: center; }
  .cl-cta { left: 0; right: 0; top: 750px; display: flex; justify-content: center; align-items: center; gap: 40px; }
  .cl-cta .talk { font-family: "Oswald", sans-serif; text-transform: uppercase; font-size: 26px; letter-spacing: 5px; color: var(--ink); font-weight: 600;
    padding: 10px 24px; border: 2px solid var(--gold); border-radius: 4px; }
  .cl-cta .ig { display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 600; color: var(--char); }
  .cl-cta .ig svg { width: 32px; height: 32px; }

  /* wipe transition: its panel takes the colour of the incoming scene */
  #wipe { position: absolute; top: 0; left: 0; width: 2472px; height: 1080px; z-index: 10; display: flex; }
  #wipe .p { flex: 1; background: var(--bg); }
  #wipe .e1 { width: 10px; background: var(--gold-soft); }
  #wipe .e2 { width: 26px; background: var(--gold); }
</style>
</head>
<body>
<div id="stage" class="grid-light">
  <svg id="glow" width="1920" height="1080" viewBox="0 0 1920 1080">
    <path id="wave1" fill="none" stroke="#f0b028" stroke-width="3" opacity="0.5"/>
    <path id="wave2" fill="none" stroke="#58585c" stroke-width="1.5" opacity="0.14"/>
    <g id="sparks"></g>
  </svg>
  <div id="scenes"></div>
  <div id="cap"><span></span></div>
  <div id="wipe"><div class="e2"></div><div class="e1"></div><div class="p"></div><div class="e1"></div><div class="e2"></div></div>
</div>

<script src="timeline.js"></script>
<script src="vo-timing.js"></script>
<script src="subtitles-ar.js"></script>
<script>
// ---------- content ----------
const icon = (body, stroke, w = 3.2) => `<svg viewBox="0 0 64 64" fill="none" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
const ICON_BODY = {

  people: '<circle cx="32" cy="20" r="8"/><path d="M18 52c0-9 6-15 14-15s14 6 14 15"/><circle cx="12" cy="26" r="5"/><path d="M3 50c0-6 4-10 9-10"/><circle cx="52" cy="26" r="5"/><path d="M61 50c0-6-4-10-9-10"/>',
  performance: '<path d="M6 56h52"/><rect x="10" y="38" width="9" height="18"/><rect x="27" y="28" width="9" height="28"/><rect x="44" y="16" width="9" height="40"/><path d="M8 28l14-10 12 6 20-16M46 8h8v8"/>',
  capability: '<rect x="6" y="10" width="52" height="34" rx="3"/><path d="M22 54h20M32 44v10"/><path d="M20 24l12-6 12 6-12 6z"/><path d="M25 27v5c4 3 10 3 14 0v-5"/>',
  resilience: '<path d="M32 6l22 8v16c0 14-9 23-22 28C19 53 10 44 10 30V14z"/><path d="M22 32l7 7 13-14"/>',
  // service icons
  restructure: '<path d="M50 24A20 20 0 0 0 14 22"/><path d="M14 10v12h12"/><path d="M14 40a20 20 0 0 0 36 2"/><path d="M50 54V42H38"/>',
  gear: '<circle cx="32" cy="32" r="8"/><circle cx="32" cy="32" r="18"/><path d="M32 6v8M32 50v8M6 32h8M50 32h8M13.6 13.6l5.7 5.7M44.7 44.7l5.7 5.7M13.6 50.4l5.7-5.7M44.7 19.3l5.7-5.7"/>',

function cityLayer(svg, { fill, minH, maxH, windows, cap, cranes = 0, landmark = false, twisted = false, roofs = true, gap = 10 }, lights) {
  const g = svgEl('g', {}, svg);
  let x = -60, n = 0;
  while (x < 2020) {
    const w = 56 + rnd() * 96;
    let h = minH + rnd() * (maxH - minH);
    if (cap) h = Math.min(h, cap(x));
    const top = GROUND - h;
    const kind = roofs ? rnd() : 0.38 + rnd() * 0.62;
    n++;
    if (landmark && n === 7) {
      // landmark tower: stacked setbacks and a needle
      const cx = x + w / 2, H = Math.min(maxH * 1.35, cap ? cap(x) * 1.35 : 9e9);
      [[1, 0], [0.78, 0.32], [0.56, 0.58], [0.36, 0.78]].forEach(([ww, f]) =>
        svgEl('rect', { x: cx - w * ww / 2, y: GROUND - H * (1 - f), width: w * ww, height: H * (1 - f) + 2, fill }, g));
      svgEl('rect', { x: cx - 2, y: GROUND - H - 90, width: 4, height: 92, fill }, g);
    } else if (twisted && kind < 0.14) {
      // twisted tower: sides that weave as they rise
      const cx = x + w / 2, pts = [], ptsR = [];

        const k = (y - top) / 60;
        pts.push(`${cx - w / 2 * (0.62 + 0.38 * Math.cos(k))} ${y}`);
        ptsR.unshift(`${cx + w / 2 * (0.62 + 0.38 * Math.cos(k + 1.4))} ${y}`);
      }
      svgEl('path', { d: 'M' + pts.join(' L') + ' L' + ptsR.join(' L') + 'Z', fill }, g);
    } else {
      svgEl('rect', { x, y: top, width: w, height: h + 2, fill }, g);
      if (kind < 0.22) svgEl('path', { d: `M${x} ${top} L${x + w} ${top - w * 0.55} L${x + w} ${top}Z`, fill }, g);           // angled glass roof
      else if (kind < 0.38) svgEl('path', { d: `M${x + w * 0.15} ${top} L${x + w / 2} ${top - 70} L${x + w * 0.85} ${top}Z`, fill }, g); // tapered crown
      else if (kind < 0.52) svgEl('rect', { x: x + w * 0.2, y: top - 34, width: w * 0.6, height: 36, fill }, g);               // setback
      else if (kind < 0.62) svgEl('rect', { x: x + w / 2 - 2, y: top - 64, width: 4, height: 66, fill }, g);                  // mast
    }

      const c = { stroke: fill, 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round' };

  }

}

    svgEl('ellipse', { cx: x, cy: y, rx, ry, fill: 'url(#cloudG)', opacity: 0.55, filter: 'url(#cloudBlur)' }, sky));
  el('div', 'abs sun', null, scenery);
  const city = canvasSvg('city', scenery);
  const cdefs = svgEl('defs', {}, city);
  cdefs.innerHTML = `<linearGradient id="haze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7a43a" stop-opacity="0"/><stop offset="1" stop-color="#e7a43a" stop-opacity="0.35"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2226"/><stop offset="1" stop-color="#141216"/></linearGradient>`;
  const lights = [];
  seed = 11;
  const layers = [
    cityLayer(city, { fill: '#7a5440', minH: 260, maxH: 520, windows: 0, gap: 4 }),
    cityLayer(city, { fill: '#5e4036', minH: 220, maxH: 560, windows: 0.04, landmark: true, cap: x => x < 1000 ? 300 : 600 }, lights),
    cityLayer(city, { fill: '#42302e', minH: 170, maxH: 460, windows: 0.08, twisted: true, cranes: 0.12, cap: x => x < 1000 ? 250 : 470 }, lights),
    cityLayer(city, { fill: '#2c2226', minH: 120, maxH: 340, windows: 0.12, twisted: true, roofs: false, cap: x => x < 1000 ? 210 : 360 }, lights),
    cityLayer(city, { fill: '#1d181b', minH: 60, maxH: 190, windows: 0.16, cranes: 0.05, roofs: false, cap: x => x < 1000 ? 150 : 200 }, lights)
  ];
  // haze between the layers
  layers.slice(0, 4).forEach(g => svgEl('rect', { x: -100, y: 520, width: 2120, height: GROUND - 520, fill: 'url(#haze)' }, g));
  // waterfront: promenade, river, reflections, moving light trails
  svgEl('rect', { x: 0, y: GROUND, width: 1920, height: 80, fill: 'url(#water)' }, city);
  svgEl('rect', { x: 0, y: GROUND - 2, width: 1920, height: 4, fill: '#5e4036' }, city);
  const refl = lights.filter(l => !l.dark && l.y > GROUND - 220).filter((_, i) => i % 3 === 0)
    .map(l => svgEl('rect', { x: l.x, y: GROUND + 6 + rnd() * 10, width: 6, height: 26 + rnd() * 30, fill: '#f6c75a', opacity: 0.18 }, city));
  const trails = Array.from({ length: 16 }, (_, k) => {
    const lane = k % 2;
    return { el: svgEl('rect', { y: GROUND - 10 + lane * 5, width: 40 + rnd() * 50, height: 3, rx: 1.5, fill: lane ? '#ff8a5c' : '#fff3cf', opacity: 0.85 }, city),
             dir: lane ? -1 : 1, x0: rnd() * 2200, v: 260 + rnd() * 220 };
  });

  const metaLogo = img('assets/mira-cle-logo-white.png', 'abs meta-logo', meta);
  const mText = el('div', 'abs meta-text', `<div class="k head">Explore</div>
    <div class="h head"><div>Leadership</div><div>Metamorphosis${TM}</div></div><div class="p head">Program</div>
    <div class="d">An executive leadership journey inspired by nature’s most profound transformation.</div>`, meta);
  const [mk, mh, mp, md] = ['.k', '.h', '.p', '.d'].map(q => mText.querySelector(q));

  // chrysalis on a silk thread, then the butterfly
  const fx = canvasSvg('fx', meta);
  const CH = [1230, 470];
  const thread = svgEl('line', { x1: CH[0], y1: 0, x2: CH[0], y2: CH[1] - 58, stroke: 'rgba(255,243,207,0.7)', 'stroke-width': 2 }, fx);
  const glowC = svgEl('circle', { cx: CH[0], cy: CH[1], r: 90, fill: 'url(#chG)' }, fx);
  svgEl('defs', {}, fx).innerHTML = `<radialGradient id="chG"><stop offset="0" stop-color="#fff3cf" stop-opacity="0.9"/><stop offset="1" stop-color="#f0b028" stop-opacity="0"/></radialGradient>
    <linearGradient id="podG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9831f"/><stop offset="0.5" stop-color="#f6c75a"/><stop offset="1" stop-color="#9c6a18"/></linearGradient>`;
  const podL = svgEl('path', { d: `M${CH[0]} ${CH[1] - 60} C ${CH[0] - 34} ${CH[1] - 40} ${CH[0] - 34} ${CH[1] + 40} ${CH[0]} ${CH[1] + 64} Z`, fill: 'url(#podG)', stroke: '#2e2e31', 'stroke-width': 3 }, fx);
  const podR = svgEl('path', { d: `M${CH[0]} ${CH[1] - 60} C ${CH[0] + 34} ${CH[1] - 40} ${CH[0] + 34} ${CH[1] + 40} ${CH[0]} ${CH[1] + 64} Z`, fill: 'url(#podG)', stroke: '#2e2e31', 'stroke-width': 3 }, fx);
  const dust = Array.from({ length: 40 }, () => svgEl('circle', { r: 3, fill: '#fff3cf', opacity: 0 }, fx));
  const fly = svgEl('svg', { class: 'abs fly', width: 260, height: 220, viewBox: '-130 -110 260 220' }, meta);
  fly.innerHTML = `<defs>
      <linearGradient id="fwG" x1="0" y1="0" x2="-1" y2="-1"><stop offset="0" stop-color="#d99a14"/><stop offset="0.55" stop-color="#f6c75a"/><stop offset="1" stop-color="#ffe7a6"/></linearGradient>
      <linearGradient id="hwG" x1="0" y1="0" x2="-1" y2="1"><stop offset="0" stop-color="#c98a12"/><stop offset="1" stop-color="#f6c75a"/></linearGradient></defs>
    <g class="hl">${HINDWING}</g><g class="hr"><g transform="scale(-1,1)">${HINDWING}</g></g>
    <g class="fl">${FOREWING}</g><g class="fr"><g transform="scale(-1,1)">${FOREWING}</g></g>
    <ellipse cx="0" cy="8" rx="8" ry="40" fill="#2e2e31"/><circle cx="0" cy="-34" r="9" fill="#2e2e31"/>
    <path d="M-3 -40 C -10 -64 -22 -76 -30 -80 M3 -40 C 10 -64 22 -76 30 -80" stroke="#2e2e31" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="-30" cy="-80" r="4" fill="#2e2e31"/><circle cx="30" cy="-80" r="4" fill="#2e2e31"/>`;
  const [wfl, wfr, whl, whr] = ['.fl', '.fr', '.hl', '.hr'].map(q => fly.querySelector(q));
  const sheens = [...fly.querySelectorAll('.sheen')];
  // flight: out of the chrysalis, a low pass over the city (clear of the text), then up to hover
  const bez = (p0, p1, p2, p3, u) => {
    const v = 1 - u;
    return [0, 1].map(i => v * v * v * p0[i] + 3 * v * v * u * p1[i] + 3 * v * u * u * p2[i] + u * u * u * p3[i]);
  };
  const legs = [
    [[CH[0], CH[1]], [1290, 800], [960, 950], [560, 880]],
    [[560, 880], [380, 920], [1150, 930], [1330, 660]],
    [[1330, 660], [1470, 520], [1520, 420], [1560, 360]]
  ];
  const flight = u => {
    const k = Math.min(2, Math.floor(clamp(u) * 3));
    return bez(...legs[k], clamp(u) * 3 - k);
  };
  const FLIGHT = 5.4;
  // when (as a share of the flight) the butterfly first passes over each window
  for (let k = 0; k <= 240; k++) {
    const [fx_, fy_] = flight(k / 240);
    lights.forEach(l => { if (l.wake === undefined && l.pick && Math.abs(l.x - fx_) < 180 && l.y > fy_ - 40) l.wake = k / 240; });
  }

  return (t, s, e, marks) => {
    hdr(t, s, e);
    animateTitle(T, t, s);
    const at = th.services.map((_, k) => marks[k] ?? s + 1.7 + k * 0.6);
    const mt = marks.m ?? s + 12;
    ghost.style.opacity = fade(t, s + 0.6, 1.2);
    pop(hub, prog(t, s + 0.9, 0.7, easeBack), 0.3);
    ring.setAttribute('opacity', fade(t, s + 1.2, 0.6));
    bubs.forEach((b, k) => {
      draw(spokes[k], prog(t, at[k] - 0.45, 0.4));
      const hl = spoken(t, at, k);
      const p = prog(t, at[k] - 0.1, 0.6, easeBack);
      b.style.opacity = fade(t, at[k] - 0.1, 0.25);
      b.style.transform = `scale(${(0.5 + 0.5 * p) * (1 + 0.08 * hl)})`;
      b.style.boxShadow = `0 12px 30px rgba(46,46,49,0.15), 0 0 0 ${10 * hl}px rgba(${k === 0 ? '255,255,255' : '46,46,49'},0.85)`;
    });

    // the feature opens as a circle growing out of the first bubble
    const op = prog(t, mt - 0.6, 1.1, easeInOut);
    meta.style.display = op > 0 ? 'block' : 'none';
    meta.style.clipPath = `circle(${op * 2300}px at ${pos[0][0]}px ${pos[0][1]}px)`;
    if (op <= 0) return;
    const ft = t - (mt - 0.6);
    scenery.style.transform = `scale(${1 + 0.05 * clamp(ft / 9)})`;
    layers.forEach((g, i) => g.setAttribute('transform', `translate(${-ft * (3 + i * 5)} 0)`));
    clouds.forEach((c, i) => c.setAttribute('transform', `translate(${ft * (6 + i * 3)} 0)`));
    stars.forEach(st => st.setAttribute('opacity', st.base * (0.6 + 0.4 * Math.sin(t * 2.2 + st.tw))));
    refl.forEach((r, i) => r.setAttribute('opacity', 0.12 + 0.12 * Math.sin(t * 5 + i)));
    trails.forEach(tr => {
      const x = ((tr.x0 + tr.dir * tr.v * ft) % 2300 + 2300) % 2300 - 200;
      tr.el.setAttribute('x', x);
    });
    rise(mk, prog(t, mt - 0.1, 0.6), 20);
    rise(mh, prog(t, mt + 0.2, 0.8), 40);
    rise(mp, prog(t, mt + 0.6, 0.7), 30);
    const segs = VO_THEMES[idx].segments || [];
    rise(md, prog(t, (segs[8] ? segs[8].t : mt + 2.8) - 0.2, 0.8), 24);
    metaLogo.style.opacity = fade(t, mt + 0.4, 0.5);

    // chrysalis: glows, trembles, splits open
    const crack = mt + 1.1;
    const shake = t < crack ? Math.sin(t * 40) * 2 * fade(t, crack - 0.6, 0.6) : 0;
    const open = prog(t, crack, 0.6);
    thread.setAttribute('opacity', fade(t, mt - 0.2, 0.4) * (1 - prog(t, crack + 0.6, 0.6)));
    glowC.setAttribute('opacity', fade(t, mt - 0.2, 0.4) * (0.6 + 0.4 * Math.sin(t * 6)) * (1 - prog(t, crack + 0.3, 0.8)) + 0.9 * open * (1 - prog(t, crack + 0.2, 0.6)));
    podL.setAttribute('transform', `translate(${shake - 40 * open} ${60 * open * open}) rotate(${-35 * open} ${CH[0]} ${CH[1] - 60})`);
    podR.setAttribute('transform', `translate(${shake + 40 * open} ${60 * open * open}) rotate(${35 * open} ${CH[0]} ${CH[1] - 60})`);
    [podL, podR].forEach(pd => pd.setAttribute('opacity', fade(t, mt - 0.2, 0.4) * (1 - prog(t, crack + 0.4, 0.5))));

    // butterfly: unfolds out of the chrysalis, then flies
    const born = prog(t, crack + 0.1, 0.6, easeBack);
    const u = clamp((t - crack - 0.5) / FLIGHT);
    let [x, y] = flight(u);
    if (t > crack + 0.5 + FLIGHT) { const h = t - crack - 0.5 - FLIGHT; x += 16 * Math.sin(h * 1.4); y += 12 * Math.sin(h * 2.1); }
    const [x2, y2] = flight(Math.min(1, u + 0.01));
    const vx = x2 - x, vy = y2 - y;
    const bank = u < 1 ? clamp(vx / 8, -1, 1) * 22 : 6 * Math.sin(t * 1.6);
    const ph = (t - crack) * Math.PI * 2 * 3.6;
    const fore = 0.12 + 0.88 * Math.abs(Math.cos(ph));
    const hind = 0.18 + 0.82 * Math.abs(Math.cos(ph - 0.45));
    const unfold = clamp(born);
    fly.style.opacity = fade(t, crack + 0.05, 0.2);
    fly.style.transform = `translate(${x - 130}px, ${y - 110}px) rotate(${bank}deg) scale(${(0.35 + 0.65 * unfold) * (0.95 + 0.15 * clamp(u))})`;
    const wing = (g, sx) => g.setAttribute('transform', `scale(${sx} ${1 - 0.06 * (1 - sx)}) skewY(${(1 - sx) * 8})`);
    wing(wfl, fore * unfold + (1 - unfold) * 0.1); wing(wfr, fore * unfold + (1 - unfold) * 0.1);
    wing(whl, hind * unfold + (1 - unfold) * 0.1); wing(whr, hind * unfold + (1 - unfold) * 0.1);
    sheens.forEach(sh => sh.setAttribute('opacity', 0.35 * (1 - fore)));

    // golden dust shed along the path
    dust.forEach((d, k) => {
      const age = (k / dust.length) * 1.6;
      const tu = clamp((t - crack - 0.5 - age) / FLIGHT);
      const alive = t - crack - 0.5 - age > 0 ? 1 : 0;
      const [dx, dy] = flight(tu);
      d.setAttribute('cx', dx + 10 * Math.sin(k * 2.3 + t * 2));
      d.setAttribute('cy', dy + 20 + age * 40);
      d.setAttribute('opacity', alive * (1 - age / 1.6) * 0.85);
      d.setAttribute('r', 3.6 * (1 - age / 2));
    });
    // windows wake up where the butterfly has flown
    lights.forEach(l => {
      let o = l.base;
      if (l.wake !== undefined) {
        const wv = fade(t, crack + 0.5 + l.wake * FLIGHT, 0.6);
        if (wv > 0) o = Math.max(o, wv * (0.65 + 0.3 * Math.sin(t * 3 + l.tw)));
      }
      l.el.setAttribute('opacity', o);
    });
  };
}

// 03 performance: a staircase chart, one rising bar per service
function buildPerformance(th, idx) {
  const L = el('div', 'layer grid-dark s3', null, root);
  const ghost = el('div', 'abs ghost', '03', L);
  const hdr = header(L, idx, th.tone);
  const T = titleBlock(L, th);
  const chart = canvasSvg('chart', L);
  [380, 480, 580, 680, 780].forEach(y => svgEl('line', { x1: 740, x2: 1800, y1: y, y2: y, stroke: 'rgba(255,255,255,0.07)', 'stroke-width': 2 }, chart));
  const base = wire(chart, 'M740 880 H1800', 'rgba(255,255,255,0.35)', 3);
  const xs = [750, 1006, 1262, 1518], hs = [230, 330, 430, 530];
  const bars = th.services.map((s, k) => place(el('div', 'abs bar', `<div class="in"><div class="n">0${k + 1}</div><div class="s">${s}</div></div>`, L), xs[k], 880 - hs[k], 236, hs[k]));
  const pts = xs.map((x, k) => [x + 118, 880 - hs[k] - 46]);
  const END = [1930, 168];
  const trend = wire(chart, 'M' + pts.map(p => p.join(' ')).join(' L') + ` L${END[0]} ${END[1]}`, '#f0b028', 5);
  const dots = pts.map(([x, y]) => svgEl('circle', { cx: x, cy: y, r: 10, fill: '#2b2b2e', stroke: '#f0b028', 'stroke-width': 5 }, chart));
  // how far along the trend line each point sits, so it draws in step with the bars
  const seg = [0];
  for (let k = 1; k < pts.length; k++) seg.push(seg[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]));
  const total = seg[3] + Math.hypot(END[0] - pts[3][0], END[1] - pts[3][1]);
  return (t, s, e, marks) => {
    hdr(t, s, e);
    animateTitle(T, t, s);
    ghost.style.opacity = fade(t, s + 0.6, 1.2);
    const at = th.services.map((_, k) => marks[k] ?? s + 1.7 + k * 0.6);
    draw(base, prog(t, s + 0.9, 0.9, easeInOut));
    let line = 0;
    bars.forEach((b, k) => {
      const p = prog(t, at[k] - 0.15, 0.7);
      const hl = spoken(t, at, k);
      b.style.transform = `scaleY(${p})`;
      b.style.opacity = p > 0 ? 1 : 0;
      b.style.boxShadow = `0 0 ${40 * hl}px rgba(240,176,40,${0.55 * hl})`;
      b.style.filter = `brightness(${1 + 0.12 * hl})`;
      b.querySelector('.in').style.opacity = fade(t, at[k] + 0.35, 0.3);
      dots[k].setAttribute('opacity', fade(t, at[k] + 0.4, 0.2));
      if (t >= at[k] + 0.3) line = Math.max(line, seg[k] / total);
      if (k > 0 && t >= at[k] - 0.2) line = Math.max(line, lerp(seg[k - 1], seg[k], prog(t, at[k] - 0.2, 0.6)) / total);
    });
    if (t >= at[3] + 0.3) line = Math.max(line, lerp(seg[3], total, prog(t, at[3] + 0.6, 1.0)) / total);
    draw(trend, line);
  };
}

// 04 capability: photo panel, service tiles, then the Aramex testimonial
function buildCapability(th, idx) {
  const L = el('div', 'layer grid-light s4', null, root);
  const hdr = header(L, idx, th.tone);
  const photo = el('div', 'abs photo', null, L);
  const pimg = img('assets/key-visual.jpg', null, photo);
  el('div', 'shade', null, photo);
  const edge = el('div', 'edge', null, photo);
  const T = titleBlock(L, th, false);
  const tx = [960, 1400], ty = [200, 560];
  const tiles = th.services.map((s, k) => place(el('div', 'abs tile',
    `<div class="top"><div class="ic">${icon(ICON_BODY[th.icons[k]], '#ffffff', 3.4)}</div><div class="n">0${k + 1}</div></div><div class="s">${s}</div>`, L), tx[k % 2], ty[k >> 1]));
  const q = th.quote;
  const card = el('div', 'abs qcard', `<div class="qm">\u201C</div><div class="q">${q.q}</div>
    <div class="foot"><div><div class="who">${q.who}</div><div class="org">${q.org}</div></div><img src="${q.logo}"></div>`, L);
  images.push(card.querySelector('img'));
  return (t, s, e, marks) => {
    hdr(t, s, e);
    const pp = prog(t, s, 0.9, easeInOut);
    photo.style.clipPath = `inset(0 ${(1 - pp) * 100}% 0 0)`;
    pimg.style.transform = `scale(${1.08 - 0.06 * clamp((t - s) / (e - s))})`;
    animateTitle(T, t, s + 0.3, -40);
    const at = th.services.map((_, k) => marks[k] ?? s + 1.7 + k * 0.6);
    tiles.forEach((tile, k) => {
      const p = prog(t, at[k] - 0.1, 0.6, easeBack);
      const hl = spoken(t, at, k);
      tile.style.opacity = fade(t, at[k] - 0.1, 0.25);
      tile.style.transform = `translateY(${(1 - p) * 40 - 10 * hl}px) scale(${0.9 + 0.1 * p})`;
      tile.style.background = mixRGB([255, 255, 255], [240, 176, 40], hl);
      tile.querySelector('.ic').style.background = mixRGB([240, 176, 40], [46, 46, 49], hl);
      tile.querySelector('.n').style.color = mixRGB([217, 154, 20], [46, 46, 49], hl);
    });
    // the tiles and heading clear, the photo opens to full width, the testimonial rises
    const qt = marks.q ?? s + 9;
    const out = prog(t, qt - 0.7, 0.7, easeInOut);
    tiles.forEach((tile, k) => { if (out > 0) { tile.style.opacity = 1 - out; tile.style.transform += ` translateX(${out * 120}px)`; } });
    [T.pillar, T.theme].forEach(n => { if (out > 0) n.style.opacity = Math.min(parseFloat(n.style.opacity || 1), 1 - out); });
    const wide = prog(t, qt - 0.5, 1.0, easeInOut);
    photo.style.width = lerp(900, 1920, wide) + 'px';
    pimg.style.left = lerp(-1470, -240, wide) + 'px';
    edge.style.opacity = 1 - wide;
    const cp = prog(t, qt + 0.2, 0.9);
    card.style.opacity = fade(t, qt + 0.2, 0.3);
    card.style.transform = `translateY(${(1 - cp) * 60}px)`;
  };
}

// 05 resilience: a shield with pulse rings, the services as stations around it
function buildResilience(th, idx) {
  const L = el('div', 'layer grid-dark s5', null, root);
  const hdr = header(L, idx, th.tone);
  const T = titleBlock(L, th, false);
  const radar = canvasSvg('radar', L);
  const C = [960, 640];
  const rings = [0, 1, 2].map(() => svgEl('circle', { cx: C[0], cy: C[1], r: 120, fill: 'none', stroke: '#f0b028', 'stroke-width': 3 }, radar));
  const halo = svgEl('circle', { cx: C[0], cy: C[1], r: 130, fill: 'rgba(240,176,40,0.08)', stroke: 'rgba(240,176,40,0.35)', 'stroke-width': 2 }, radar);
  const spots = [[150, 430, 'l'], [150, 700, 'l'], [1270, 430, 'r'], [1270, 700, 'r']];
  const links = spots.map(([x, y, side]) => {
    const cy = y + 60, ex = side === 'l' ? x + 500 : x;
    const sx = side === 'l' ? C[0] - 110 : C[0] + 110;
    return wire(radar, `M${sx} ${C[1] + (cy < C[1] ? -40 : 40)} L${ex} ${cy}`, 'rgba(240,176,40,0.7)', 3);
  });
  const shield = el('div', 'abs shield', `<svg viewBox="0 0 200 220"><path d="M100 8l84 30v62c0 54-36 90-84 112C52 190 16 154 16 100V38z" fill="#f0b028"/>
    <path class="tick" d="M62 112l28 28 52-56" fill="none" stroke="#2b2b2e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>`, L);
  const tick = shield.querySelector('.tick');
  const stns = th.services.map((s, k) => place(el('div', 'abs stn ' + spots[k][2], `<div class="n">0${k + 1}</div><div class="s">${s}</div>`, L), spots[k][0], spots[k][1]));
  return (t, s, e, marks) => {
    hdr(t, s, e);
    const pp = prog(t, s + 0.4, 1.0);
    T.pillar.style.opacity = pp;
    T.pillar.style.transform = `scale(${0.9 + 0.1 * pp})`;
    rise(T.theme, prog(t, s + 0.8, 0.9));
    const at = th.services.map((_, k) => marks[k] ?? s + 1.7 + k * 0.6);
    const vo = VO_THEMES[idx] || { segments: [] };
    const ready = vo.segments[5] ? vo.segments[5].t : at[3] + 2;
    pop(shield, prog(t, s + 0.9, 0.8, easeBack), 0.4);
    halo.setAttribute('opacity', fade(t, s + 1.1, 0.5));
    const pulse = fade(t, s + 1.4, 0.6);
    rings.forEach((r, j) => {
      const ph = ((t - s) / 2.4 + j / 3) % 1;
      r.setAttribute('r', 120 + 170 * ph);
      r.setAttribute('opacity', (1 - ph) * 0.55 * pulse);
    });
    stns.forEach((st, k) => {
      draw(links[k], prog(t, at[k] - 0.4, 0.4));
      const p = prog(t, at[k] - 0.1, 0.6, easeBack);
      const hl = Math.max(spoken(t, at, k, ready - at[k]), prog(t, ready - 0.1, 0.4));
      const dir = spots[k][2] === 'l' ? -1 : 1;
      st.style.opacity = fade(t, at[k] - 0.1, 0.25);
      st.style.transform = `translateX(${(1 - p) * 60 * dir}px)`;
      st.style.background = mixRGB([56, 56, 60], [74, 66, 44], hl);
      st.style.boxShadow = `0 0 ${30 * hl}px rgba(240,176,40,${0.35 * hl})`;
    });
    // "so a crisis meets a prepared team": the shield locks in
    tick.setAttribute('stroke-dashoffset', 1 - prog(t, ready, 0.6, easeInOut));
    const lock = prog(t, ready, 0.5, easeBack) * (1 - prog(t, ready + 0.5, 0.6));
    shield.style.transform = `scale(${1 + 0.08 * lock})`;
  };
}

const builders = [buildStructure, buildPeople, buildPerformance, buildCapability, buildResilience];
const themeScenes = THEMES.map((th, i) => {
  const update = builders[i](th, i);
  const L = root.lastElementChild;
  return { L, update, th };
});

const close = el('div', 'layer end-card', null, root);
el('div', 'abs end-glow', null, close);
const clRow = el('div', 'abs cl-row', null, close);
const clWords = THEMES.map(th => el('div', 'cl-w head', th.pillar, clRow));
const clLogo = el('div', 'abs logo2 cl-logo2', null, close);
const clMark = img('assets/logo2-mark.png', 'abs l-mark', clLogo);
const clWord = img('assets/logo2-word.png', 'abs l-word', clLogo);
const clSlogan = img('assets/logo2-tag.png', 'abs l-tag', clLogo);
const clRule = el('div', 'abs cl-rule', null, close);
const clCta = el('div', 'abs cl-cta', `<div class="talk">Talk to our team</div><div class="ig">${WEB_ICON}<span>${WEBSITE}</span></div><div class="ig">${IG_ICON}<span>${INSTAGRAM}</span></div>`, close);

const cap = document.querySelector('#cap span');
const capBox = document.getElementById('cap');
if (LANG === 'ar') { capBox.classList.add('ar'); cap.dir = 'rtl'; cap.lang = 'ar'; }
const wipe = document.getElementById('wipe');
const wipePanel = wipe.querySelector('.p');

// background waves for the opening, overview and closing
const glow = document.getElementById('glow');
const wave1 = document.getElementById('wave1');
const wave2 = document.getElementById('wave2');
const sparks = document.getElementById('sparks');
const sparkNodes = Array.from({ length: 9 }, () => svgEl('circle', { r: 5, fill: '#f0b028' }, sparks));
function waveY(x, t, amp, base, k, speed) {
  return base + amp * Math.sin(x * k + t * speed) + amp * 0.4 * Math.sin(x * k * 2.3 - t * speed * 0.7);
}
function wavePath(t, amp, base, k, speed) {
  let d = '';
  for (let x = -20; x <= 1940; x += 20) d += (x === -20 ? 'M' : 'L') + x + ' ' + waveY(x, t, amp, base, k, speed).toFixed(1) + ' ';
  return d;
}

// ---------- render ----------
window.seek = function (t) {
  // wipe: a panel in the incoming scene's colour, with gold edges, sweeps across;
  // scenes cut underneath it, so two scenes are never on screen together
  const tr = TRANSITIONS.find(([x]) => Math.abs(t - x) < WIPE / 2);
  if (tr) {
    const p = easeInOut(clamp((t - tr[0] + WIPE / 2) / WIPE));
    wipe.style.visibility = 'visible';
    wipe.style.transform = `translateX(${-2472 + p * 4392}px)`;
    wipePanel.style.background = TONE_BG[tr[1]];
  } else wipe.style.visibility = 'hidden';

  const inThemes = t >= TL.themes[0][0] && t < TL.close[0];
  glow.style.visibility = inThemes || t >= TL.close[0] ? 'hidden' : 'visible';
  if (!inThemes) {
    wave1.setAttribute('d', wavePath(t, 40, 945, 0.0042, 0.5));
    wave2.setAttribute('d', wavePath(t, 26, 990, 0.006, -0.35));
    sparkNodes.forEach((c, i) => {
      const x = ((i * 233 + t * 70) % 2100) - 90;
      c.setAttribute('cx', x);
      c.setAttribute('cy', waveY(x, t, 40, 945, 0.0042, 0.5));
      c.setAttribute('opacity', 0.55 + 0.35 * Math.sin(t * 2 + i));
    });
  }

  // opening: the logo assembles, then the title rises under it as it is spoken
  show(reveal, within(t, TL.open));
  if (within(t, TL.open)) {
    const s = TL.open[0];
    const mp = prog(t, s + 0.1, 0.8, easeBack);
    lgMark.style.opacity = fade(t, s + 0.1, 0.3);
    lgMark.style.transformOrigin = '300px 301px';
    lgMark.style.transform = `scale(${0.3 + 0.7 * mp}) rotate(${(1 - mp) * -120}deg)`;
    lgWord.style.clipPath = `inset(0 ${(1 - prog(t, s + 0.45, 0.8, easeInOut)) * 100}% 0 0)`;
    lgTag.style.clipPath = `inset(0 ${(1 - prog(t, s + 0.95, 1.0, x => x)) * 100}% 0 0)`;
    const t0 = (VO_BY_ID.title || { start: s + 2.2 }).start;
    tWords.forEach((w, k) => {
      const p = prog(t, t0 - 0.2 + k * 0.32, 0.6);
      w.style.transform = `translateY(${(1 - p) * 105}%)`;
    });
    tProg.style.backgroundPosition = `${100 - prog(t, t0 + 1.4, 1.0, easeInOut) * 100}% 0`;
  }

  show(over, within(t, TL.overview));
  if (within(t, TL.overview)) {
    const s = TL.overview[0];
    rise(ovTitle, prog(t, s + 0.5, 1));
    ovLine.style.transform = `scaleX(${prog(t, s + 1.0, 2.0, easeInOut)})`;
    ovNodes.forEach((n, i) => {
      const at = VO_OVER.marks[i] ?? s + 1.3 + i * 0.55;
      const p = prog(t, at - 0.1, 0.8, easeBack);
      n.style.opacity = clamp((t - at + 0.1) / 0.3);
      n.style.transform = `translateY(${(1 - p) * 30}px) scale(${0.85 + 0.15 * p})`;
    });
  }

  let tone = 'light';
  themeScenes.forEach((S, i) => {
    const span = TL.themes[i];
    const on = within(t, span);
    show(S.L, on);
    if (!on) return;
    tone = S.th.tone;
    S.update(t, span[0], span[1], (VO_THEMES[i] || {}).marks || {});
  });

  show(close, t >= TL.close[0]);
  if (t >= TL.close[0]) {
    const s = TL.close[0];
    clWords.forEach((w, i) => rise(w, prog(t, s + 0.2 + i * 0.12, 0.7), 16));
    const mp = prog(t, s + 0.4, 0.9, easeBack);
    clMark.style.opacity = fade(t, s + 0.4, 0.3);
    clMark.style.transformOrigin = '300px 301px';
    clMark.style.transform = `scale(${0.4 + 0.6 * mp}) rotate(${(1 - mp) * -90}deg)`;
    clWord.style.clipPath = `inset(0 ${(1 - prog(t, s + 0.8, 0.9, easeInOut)) * 100}% 0 0)`;
    const st = (VO_BY_ID['close-slogan'] || { start: s + 1.4 }).start;
    clSlogan.style.clipPath = `inset(0 ${(1 - prog(t, st - 0.1, 1.6, x => x)) * 100}% 0 0)`;
    const ct = (VO_BY_ID['close-cta'] || { start: s + 4.5 }).start;
    clRule.style.transform = `scaleX(${prog(t, ct - 0.5, 0.7, easeInOut)})`;
    rise(clCta, prog(t, ct - 0.3, 0.8), 20);
    // a slow settle on the finished logo
    clLogo.style.transform = `scale(${0.48 * (1.02 - 0.02 * prog(t, s + 0.4, TL.close[1] - s - 0.4, x => x))})`;
  }

  const cue = CUES.find(c => t >= c.t && t < c.end);
  capBox.classList.toggle('dark', tone === 'dark');
  if (cue) {
    cap.textContent = cue.text;
    capBox.style.opacity = Math.min(clamp((t - cue.t) / 0.15), clamp((cue.end - t) / 0.15));
    capBox.style.visibility = 'visible';
  } else capBox.style.visibility = 'hidden';
};

// fit each pillar heading to the space its layout gives it
const PILLAR_FIT = [[600, 150], [720, 150], [600, 150], [760, 130], [1100, 130]];
function fitPillars() {
  themeScenes.forEach((S, i) => {
    const p = S.L.querySelector('.pillar');
    let [maxW, size] = PILLAR_FIT[i];
    p.style.fontSize = size + 'px';
    const measure = () => { const r = document.createRange(); r.selectNodeContents(p); return r.getBoundingClientRect().width; };
    const vis = S.L.style.visibility;
    S.L.style.visibility = 'visible';
    while (measure() > maxW && size > 70) p.style.fontSize = (--size) + 'px';
    S.L.style.visibility = vis;
  });
}

window.ready = Promise.all([
  document.fonts.load('600 40px Oswald'),
  document.fonts.load('700 40px "Open Sans"'),
  document.fonts.load('700 36px Cairo', 'عربي'),
  ...images.map(n => n.complete ? Promise.resolve() : new Promise(r => { n.onload = r; n.onerror = r; }))
]).then(() => document.fonts.ready).then(fitPillars);
window.seek(0);
</script>
